services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: ${POSTGRES_DB:-mini_crm}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      default:
        aliases:
          - mini-crm-postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mini_crm || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  db-init:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    environment:
      PGPASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-mini_crm}
    entrypoint:
      - sh
      - -c
      - |
        psql -h mini-crm-postgres -U "$${POSTGRES_USER:-postgres}" -d "$${POSTGRES_DB:-mini_crm}" -v ON_ERROR_STOP=1 \
          -c "CREATE SCHEMA IF NOT EXISTS evolution_api"
        echo "db-init done"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      default:
        aliases:
          - mini-crm-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    expose:
      - "8081"
    environment:
      SERVICE_URL_EVOLUTION_API_8081: ${SERVICE_URL_EVOLUTION_API_8081}
      SERVICE_URL_EVOLUTION_API: ${SERVICE_URL_EVOLUTION_API}
      SERVER_URL: ${SERVICE_URL_EVOLUTION_API}
      SERVER_PORT: 8081
      CORS_ORIGIN: "*"
      CORS_METHODS: GET,POST,PUT,DELETE,OPTIONS
      CORS_CREDENTIALS: "true"
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER:-postgres}:${SERVICE_PASSWORD_POSTGRES}@mini-crm-postgres:5432/${POSTGRES_DB:-mini_crm}?schema=evolution_api
      DATABASE_CONNECTION_CLIENT_NAME: mini_crm_evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://mini-crm-redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: "false"
      LOG_LEVEL: ERROR,WARN,INFO
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    # TCP only: GET / returns 500 on this image and was marking the container unhealthy → Traefik 503
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('net').connect(8081,'127.0.0.1',()=>process.exit(0)).on('error',()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      SERVICE_URL_API_3000: ${SERVICE_URL_API_3000}
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${SERVICE_PASSWORD_POSTGRES}@mini-crm-postgres:5432/${POSTGRES_DB:-mini_crm}?schema=public
      CORS_ORIGIN: ${CORS_ORIGIN}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY}
      EVOLUTION_API_URL: http://evolution-api:8081
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      ADMIN_SECRET: ${ADMIN_SECRET}
      PUBLIC_API_URL: http://api:3000
      RUN_SEED: ${RUN_SEED:-true}
    depends_on:
      postgres:
        condition: service_healthy
      evolution-api:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  pgdata:
  evolution_instances:
